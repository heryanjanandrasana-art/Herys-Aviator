<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERYS ELITE V42 - SENTINEL PRO</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --blue: #3498db;
            --violet: #9b59b6;
            --rose: #e91e63;
            --gold: #f1c40f;
            --white: #ffffff;
            --border: #30363d;
            --success: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--white);
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--rose);
            text-align: center;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--rose);
            padding-bottom: 8px;
        }

        .input-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .field { display: flex; flex-direction: column; }
        .full-width { grid-column: span 2; }

        label { font-size: 0.65rem; color: #8b949e; margin-bottom: 2px; }

        input {
            background: #010409;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            color: var(--white);
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus { border-color: var(--rose); }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--rose), var(--violet));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin: 10px 0;
            font-size: 0.9rem;
        }

        .analysis-box {
            background: #010409;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 0.75rem;
            border-left: 4px solid var(--gold);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .status-row { display: flex; justify-content: space-between; align-items: center; }

        .results-table, .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
            margin-bottom: 15px;
        }

        .results-table th, .history-table th { background: #21262d; color: var(--gold); padding: 8px 2px; }
        .results-table td, .history-table td {
            border: 1px solid var(--border);
            padding: 8px 2px;
            text-align: center;
        }

        .color-blue { color: var(--blue); font-weight: bold; }
        .color-violet { color: var(--violet); font-weight: bold; }
        .color-rose { color: var(--rose); font-weight: bold; }
        
        .signal-badge {
            background: var(--success);
            color: black;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.6rem;
            display: none;
        }

        .btn-clear {
            background: transparent;
            color: #8b949e;
            border: 1px solid var(--border);
            padding: 5px;
            font-size: 0.6rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>HERYS ELITE V42 - FINAL</h1>
    
    <div class="input-form">
        <div class="field"><label>N° Tour</label><input type="number" id="tour" placeholder="Tour"></div>
        <div class="field"><label>Dernier X</label><input type="text" id="mult" placeholder="Ex: 1.25"></div>
        <div class="field full-width"><label>Decimal (BigInt)</label><input type="number" id="decimal" placeholder="Entrez le décimal"></div>
    </div>

    <button onclick="ajouterEtCalculer()">ANALYSE SENTINEL</button>

    <div id="output" style="display:none;">
        <div class="analysis-box" id="diagContainer">
            <div class="status-row" id="diagnostic"></div>
            <div class="status-row">
                <span id="signalText">Analyse en cours...</span>
                <span id="signalBadge" class="signal-badge">SIGNAL FORT</span>
            </div>
        </div>

        <h2>Nandrasana (Prédictions)</h2>
        <table class="results-table">
            <thead>
                <tr>
                    <th>Objectif</th>
                    <th>X Target</th>
                    <th>Heure</th>
                    <th>Tour</th>
                    <th>Prob.</th>
                </tr>
            </thead>
            <tbody id="predictionBody"></tbody>
        </table>

        <h2>Historique de Flux</h2>
        <table class="history-table">
            <thead>
                <tr>
                    <th>Tour</th>
                    <th>X</th>
                    <th>Ratio</th>
                    <th>Flux</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
        
        <button class="btn-clear" onclick="reinitialiser()">EFFACER TOUT L'HISTORIQUE</button>
    </div>
</div>

<script>
    let historique = JSON.parse(localStorage.getItem('herys_v42_hist')) || [];
    let pressionCumulative = 0;

    // Charger l'historique au démarrage
    if (historique.length > 0) {
        document.getElementById('output').style.display = 'block';
        actualiserHistorique();
        // Pré-remplir le tour suivant
        document.getElementById('tour').value = historique[0].tour + 1;
    }

    function ajouterEtCalculer() {
        const tourEl = document.getElementById('tour');
        const multEl = document.getElementById('mult');
        const decimalEl = document.getElementById('decimal');

        const tour = parseInt(tourEl.value);
        const mult = parseFloat(multEl.value) || 0;
        const decimal = parseInt(decimalEl.value);

        if (!tour || isNaN(decimal)) return;

        // Calcul du Ratio
        const ratio = (decimal / 4294967295) * 100;
        
        // Gestion de la Pression (Basée sur tes vidéos)
        if (mult < 1.20 && mult > 0) pressionCumulative += 20;
        else if (mult >= 2.00) pressionCumulative = 0;

        // Flux
        let flux = "➖";
        if (historique.length > 0) {
            flux = ratio > historique[0].ratio ? "<span style='color:var(--success)'>↗️</span>" : "<span style='color:var(--rose)'>↘️</span>";
        }

        // Sauvegarde
        historique.unshift({ tour, mult, ratio, flux });
        if (historique.length > 8) historique.pop();
        localStorage.setItem('herys_v42_hist', JSON.stringify(historique));

        afficherResultats(tour, ratio, flux);
        actualiserHistorique();

        // Préparation tour suivant
        tourEl.value = tour + 1;
        multEl.value = "";
        decimalEl.value = "";
        multEl.focus(); // Remet le focus sur le multiplicateur pour mobile
    }

    function afficherResultats(tour, ratio, flux) {
        document.getElementById('output').style.display = 'block';
        const diagBox = document.getElementById('diagnostic');
        const signalBadge = document.getElementById('signalBadge');
        const signalText = document.getElementById('signalText');
        const tableBody = document.getElementById('predictionBody');

        let etat = "STABLE";
        let color = "var(--gold)";

        if (ratio < 25 || pressionCumulative > 30) {
            etat = "EXPLOSION 🚀";
            color = "var(--rose)";
            signalBadge.style.display = "block";
            signalText.innerText = "Favorable pour mise";
        } else if (ratio > 75) {
            etat = "RECHARGE ⚡";
            color = "var(--blue)";
            signalBadge.style.display = "none";
            signalText.innerText = "Attente conseillée";
        } else {
            signalBadge.style.display = "none";
            signalText.innerText = "Analyse Neutre";
        }

        diagBox.innerHTML = `<span>Ratio: <b style="color:${color}">${ratio.toFixed(2)}%</b></span> <span>Flux: ${flux}</span> <span>Etat: <b style="color:${color}">${etat}</b></span>`;

        // Configuration Cibles
        const predictions = [
            { obj: "Sécurisé", target: "x2.00+", t: 3, c: "color-blue", p: 82 },
            { obj: "Expert", target: "x5.00+", t: 8, c: "color-violet", p: 65 },
            { obj: "Sentinel", target: "x20.00+", t: 20, c: "color-rose", p: 40 }
        ];

        tableBody.innerHTML = "";
        const now = new Date();

        predictions.forEach(p => {
            const predTime = new Date(now.getTime() + (p.t / 2) * 60000); // Temps ajusté
            const timeStr = predTime.getHours().toString().padStart(2, '0') + ":" + predTime.getMinutes().toString().padStart(2, '0');
            
            let probFinale = Math.min(p.p + (pressionCumulative / 2) + (100 - ratio) / 4, 99);

            tableBody.innerHTML += `<tr>
                <td>${p.obj}</td>
                <td class="${p.c}">${p.target}</td>
                <td>${timeStr}</td>
                <td>${tour + p.t}</td>
                <td class="color-rose"><b>${probFinale.toFixed(0)}%</b></td>
            </tr>`;
        });
    }

    function actualiserHistorique() {
        const hBody = document.getElementById('historyBody');
        hBody.innerHTML = "";
        historique.forEach(h => {
            hBody.innerHTML += `<tr>
                <td>${h.tour}</td>
                <td>${h.mult || '-'}</td>
                <td>${h.ratio.toFixed(1)}%</td>
                <td>${h.flux}</td>
            </tr>`;
        });
    }

    function reinitialiser() {
        if(confirm("Effacer tout l'historique ?")) {
            historique = [];
            localStorage.removeItem('herys_v42_hist');
            location.reload();
        }
    }
</script>
</body>
</html>
