<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERYS ELITE V3.1</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    padding: 20px;
}

textarea {
    width: 90%;
    height: 120px;
}

button {
    padding: 10px 20px;
    margin-top: 10px;
    background: #22c55e;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
    <h1>HERYS ELITE V3.1</h1>

    <p>Multiplicateurs</p>

    <textarea id="data"></textarea>

    <button onclick="analyser()">ANALYSER</button>

    <div class="result" id="result"></div>
</div>

<script>
function getTime() {
    let now = new Date();
    return now.toLocaleTimeString(); // HH:MM:SS
}

function analyser() {
    let input = document.getElementById("data").value;
    let arr = input.split(",").map(x => parseFloat(x.trim()));

    let total = arr.length;

    let bleu = arr.filter(x => x < 2).length;
    let violet = arr.filter(x => x >= 2 && x < 10).length;
    let rose = arr.filter(x => x >= 10).length;

    let p2 = (violet + rose) / total;
    let p1 = bleu / total;
    let p3 = rose / total;

    // Score global
    let score = (p2 * 0.5) + (p3 * 0.3) + ((1 - p1) * 0.2);

    // Détection "zone rose"
    let last = arr[arr.length - 1];
    let signal = "";

    if (p3 > 0.12 && last < 2) {
        signal = "🔥 MOMENT POTENTIEL ROSE (phase volatile)";
    } else if (p2 > 0.6) {
        signal = "⚖️ Zone stable (violet dominant)";
    } else {
        signal = "⛔ Zone faible (risque élevé)";
    }

    let rec = "";

    if (score > 0.65) {
        rec = "SAFE (1.5x - 2x)";
    } else if (score > 0.5) {
        rec = "MODERATE (2x - 3x)";
    } else {
        rec = "RISK (attendre)";
    }

    document.getElementById("result").innerHTML = `
        ⏰ Heure: ${getTime()} <br><br>

        📊 Total: ${total} <br><br>

        🔵 Bleu: ${bleu} (${(p1*100).toFixed(1)}%) <br>
        🟣 Violet: ${violet} <br>
        🔴 Rose: ${rose} (${(p3*100).toFixed(1)}%) <br><br>

        🎯 Probabilité ≥2x: ${(p2*100).toFixed(1)}% <br><br>

        ⚡ Score: ${score.toFixed(2)} <br><br>

        📍 Analyse: <br>
        ${signal} <br><br>

        👉 Conseil: <br>
        ${rec}
    `;
}
</script>

</body>
</html>
