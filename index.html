<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERYS ELITE V42.6 - GOLD EDITION</title>
    <style>
        :root {
            --bg: #010409; --card: #0d1117; --blue: #3498db; --violet: #9b59b6;
            --rose: #e91e63; --gold: #f1c40f; --white: #ffffff; --border: #30363d;
            --green: #2ecc71; --red: #ff4d4d;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); display: flex; justify-content: center; padding: 10px; margin: 0; }
        .app-container { width: 100%; max-width: 500px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        
        h1 { color: var(--rose); text-align: center; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; border-bottom: 2px solid var(--rose); padding-bottom: 10px; }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .field { display: flex; flex-direction: column; }
        .full-width { grid-column: span 2; }
        label { font-size: 0.7rem; color: #8b949e; margin-bottom: 4px; font-weight: bold; }
        input { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 12px; color: var(--white); font-family: monospace; font-size: 1rem; }

        button { width: 100%; background: linear-gradient(135deg, var(--rose), var(--violet)); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; transition: 0.3s; }
        button:active { transform: scale(0.97); opacity: 0.8; }

        .analysis-box { background: #010409; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 5px solid var(--gold); transition: 0.5s; }
        .gold-alert { border-left-color: var(--green) !important; background: rgba(46, 204, 113, 0.1) !important; box-shadow: 0 0 15px var(--green); }
        .trap-alert { border-left-color: var(--red) !important; background: rgba(255, 77, 77, 0.1) !important; }

        .progress-container { background: #21262d; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--rose); width: 0%; transition: 0.5s; }
        
        .status-label { font-weight: bold; text-align: center; display: block; margin-top: 5px; font-size: 0.9rem; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-bottom: 20px; }
        th { background: #21262d; color: var(--gold); padding: 10px 2px; }
        td { border: 1px solid var(--border); padding: 10px 2px; text-align: center; }

        .color-blue { color: var(--blue); font-weight: bold; }
        .color-violet { color: var(--violet); font-weight: bold; }
        .color-rose { color: var(--rose); font-weight: bold; }
        .prob-badge { background: rgba(255,255,255,0.1); padding: 3px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>HERYS ELITE V42.6 GOLD</h1>
    
    <div class="input-group">
        <div class="field"><label>Tour</label><input type="number" id="tour" placeholder="000"></div>
        <div class="field"><label>Valeur X</label><input type="text" id="mult" placeholder="1.00"></div>
        <div class="field full-width"><label>Decimal (BigInt)</label><input type="number" id="decimal" placeholder="Decimal Hash"></div>
    </div>

    <button onclick="runGoldAnalysis()">LANCER L'ANALYSE GOLD</button>

    <div id="results" style="display:none;">
        <div id="diagCard" class="analysis-box">
            <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
                <span>Ratio: <b id="txtRatio">0%</b></span>
                <span>Flux: <b id="txtFlux">➖</b></span>
            </div>
            <div class="progress-container"><div id="barRatio" class="progress-bar"></div></div>
            <span id="txtAdvice" class="status-label">ANALYSE...</span>
        </div>

        <h2>Nandrasana (Prédictions)</h2>
        <table id="predictionTable">
            <thead><tr><th>Cible</th><th>X</th><th>Heure</th><th>Tour</th><th>Prob.</th></tr></thead>
            <tbody id="predBody"></tbody>
        </table>

        <h2>Historique & Séquences</h2>
        <table>
            <thead><tr><th>Tour</th><th>X</th><th>Ratio</th><th>Flux</th></tr></thead>
            <tbody id="histBody"></tbody>
        </table>
        <div style="text-align:right;"><button style="width:auto; padding:5px 10px; font-size:0.6rem; background:#21262d;" onclick="localStorage.clear(); location.reload();">Reset Session</button></div>
    </div>
</div>

<script>
    let session = JSON.parse(localStorage.getItem('herys_gold_db')) || [];

    function runGoldAnalysis() {
        const tour = parseInt(document.getElementById('tour').value);
        const mult = document.getElementById('mult').value;
        const decimal = document.getElementById('decimal').value;
        if (!tour || !mult || !decimal) return;

        const ratio = (parseInt(decimal) / 4294967295) * 100;
        let flux = "➖";
        if (session.length > 0) { flux = ratio > session[0].ratio ? "↗️" : "↘️"; }

        session.unshift({ tour, mult, ratio, flux });
        if (session.length > 15) session.pop();
        localStorage.setItem('herys_gold_db', JSON.stringify(session));

        updateUI(tour, ratio, flux, mult);
    }

    function updateUI(tour, ratio, flux, mult) {
        const resDiv = document.getElementById('results');
        const diagCard = document.getElementById('diagCard');
        const advice = document.getElementById('txtAdvice');
        resDiv.style.display = 'block';
        
        document.getElementById('txtRatio').innerText = ratio.toFixed(2) + "%";
        document.getElementById('barRatio').style.width = ratio + "%";
        document.getElementById('txtFlux').innerText = flux;
        document.getElementById('txtFlux').style.color = flux === "↗️" ? "var(--green)" : "var(--rose)";

        // Logique GOLD basée sur les tests
        diagCard.className = "analysis-box";
        if (ratio < 15) {
            diagCard.classList.add('gold-alert');
            advice.innerText = "🔥 SIGNAL D'OR : EXPLOSION ROSE IMMINENTE";
            advice.style.color = "var(--green)";
        } else if (ratio > 75) {
            diagCard.classList.add('trap-alert');
            advice.innerText = "🚫 ZONE DE PIÈGE : RECHARGE EN COURS";
            advice.style.color = "var(--red)";
        } else {
            advice.innerText = "ZONE STABLE : DISTRIBUTION MODÉRÉE";
            advice.style.color = "var(--gold)";
        }

        const now = new Date();
        const targets = [
            { id: "Safe", x: "x2.00", t: 3, tr: 4, p: 85, c: "color-blue" },
            { id: "Elite", x: "x5.00", t: 7, tr: 11, p: 60, c: "color-violet" },
            { id: "Gold", x: "x20.00+", t: 12, tr: 26, p: 45, c: "color-rose" }
        ];

        const pBody = document.getElementById('predBody');
        pBody.innerHTML = "";
        targets.forEach(item => {
            let pFinal = item.p;
            if (ratio < 25) pFinal += 14; 
            if (ratio > 80) pFinal = 5; // Verrouillage de sécurité
            const time = new Date(now.getTime() + item.t * 60000);
            const timeStr = time.getHours().toString().padStart(2, '0') + ":" + time.getMinutes().toString().padStart(2, '0');
            pBody.innerHTML += `<tr><td>${item.id}</td><td class="${item.c}">${item.x}</td><td>${timeStr}</td><td>${tour + item.tr}</td><td><span class="prob-badge">${pFinal}%</span></td></tr>`;
        });

        const hBody = document.getElementById('histBody');
        hBody.innerHTML = "";
        session.forEach(h => {
            let c = parseFloat(h.mult) < 2 ? 'color-blue' : parseFloat(h.mult) < 5 ? 'color-violet' : 'color-rose';
            hBody.innerHTML += `<tr><td>${h.tour}</td><td class="${c}">${h.mult}</td><td>${h.ratio.toFixed(1)}%</td><td>${h.flux}</td></tr>`;
        });
    }

    if (session.length > 0) {
        const last = session[0];
        updateUI(last.tour, last.ratio, last.flux, last.mult);
    }
</script>
</body>
</html>
